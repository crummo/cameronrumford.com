# Publishes the site to GitHub Pages, adding a /work/<slug>/ page per piece
# so shared links preview that piece. Requires Settings → Pages → Source:
# "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '.claude' \
            --exclude '_site' --exclude 'TASKS.md' --exclude 'update.sh'
          python3 .github/scripts/build_piece_pages.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
